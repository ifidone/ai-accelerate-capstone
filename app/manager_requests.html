<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Queue · Supply Sage</title>

  <style>
    :root {
      --bg: #fbf7f3;
      --surface: rgba(255, 255, 255, 0.76);
      --surface-solid: #ffffff;
      --border: rgba(20, 20, 40, 0.08);
      --text: #1a1524;
      --text-muted: #6b6880;
      --accent: #7c5cff;
      --accent-grad: linear-gradient(135deg, #7c5cff 0%, #ff6ea8 100%);
      --green: #16876c;
      --green-bg: rgba(71, 230, 193, 0.18);
      --red: #c92e4b;
      --red-bg: rgba(244, 50, 86, 0.1);
      --yellow: #9c6700;
      --yellow-bg: rgba(244, 176, 0, 0.18);
      --shadow-sm: 0 1px 2px rgba(20, 20, 40, 0.04), 0 1px 3px rgba(20, 20, 40, 0.06);
      --shadow-lg: 0 24px 60px -24px rgba(80, 60, 180, 0.28);
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
    }

    body::before {
      top: -140px;
      left: -120px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #ffb4c8 0%, transparent 70%);
    }

    body::after {
      right: -140px;
      bottom: -180px;
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #b6a5ff 0%, transparent 70%);
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 1040px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.25rem;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-grad);
      color: white;
      font-weight: 800;
      box-shadow: 0 6px 20px -6px rgba(124, 92, 255, 0.55);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .tag {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .main-nav {
      display: flex;
      gap: 0.3rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: var(--shadow-sm);
      flex-wrap: nowrap;
    }

    .nav-link {
      padding: 0.38rem 0.7rem;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
      padding: 0.38rem 0.55rem;
      font-size: 0.74rem;
    }

    .nav-link:hover {
      background: rgba(124, 92, 255, 0.1);
      color: var(--accent);
    }

    .nav-link.active {
      background: white;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .account {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      max-width: 310px;
      padding: 0.35rem 0.4rem 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      box-shadow: var(--shadow-sm);
    }

    #signed-in-as {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #logout {
      width: auto;
      height: auto;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: white;
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 650;
      box-shadow: var(--shadow-sm);
    }

    .page-card {
      padding: 1.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .page-heading h2 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
    }

    .page-heading p {
      margin: 0.35rem 0 0;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .role-badge {
      padding: 0.36rem 0.65rem;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.1);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.64);
    }

    .summary-card span {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .summary-card strong {
      font-size: 1.5rem;
    }

    .request-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .request-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-sm);
    }

    .request-title {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .request-card h3 {
      margin: 0;
      font-size: 1.03rem;
    }

    .request-id {
      margin: 0.25rem 0 0;
      color: var(--text-muted);
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.72rem;
    }

    .pending-badge {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: var(--yellow-bg);
      color: var(--yellow);
      font-size: 0.7rem;
      font-weight: 750;
    }

    .request-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }

    .pill {
      padding: 0.32rem 0.52rem;
      border-radius: 999px;
      background: rgba(20, 20, 40, 0.05);
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .action-button {
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .approve {
      background: var(--green-bg);
      color: var(--green);
    }

    .approve:hover {
      background: rgba(71, 230, 193, 0.3);
    }

    .reject {
      background: var(--red-bg);
      color: var(--red);
    }

    .reject:hover {
      background: rgba(244, 50, 86, 0.18);
    }

    .notice {
      margin-top: 0.75rem;
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .notice.success {
      background: rgba(71, 230, 193, 0.14);
      color: #107c62;
    }

    .notice.error {
      background: var(--red-bg);
      color: var(--red);
    }

    .empty,
    .error {
      padding: 2.8rem 1rem;
      border-radius: 14px;
      text-align: center;
    }

    .empty {
      color: var(--text-muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--text);
      font-size: 1.05rem;
    }

    .error {
      border: 1px solid rgba(244, 50, 86, 0.25);
      background: var(--red-bg);
      color: var(--red);
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 1rem 0.75rem;
      }

      .brand-area,
      .page-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.65rem;
      }

      .main-nav {
        flex-wrap: wrap;
      }

      .page-card {
        padding: 1rem;
      }

      .request-card {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  
    /* Supply Sage unified green UI overrides */
    :root {
      --bg: #f7faf7;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --border: rgba(16, 55, 43, 0.10);

      --text: #16352c;
      --text-muted: #697b74;

      --accent: #16876c;
      --accent-dark: #0f6954;
      --accent-light: #63cfa4;
      --accent-grad: linear-gradient(135deg, #16876c 0%, #63cfa4 100%);

      --green: #16876c;
      --green-bg: rgba(99, 207, 164, 0.20);
      --red: #c92e4b;
      --red-bg: rgba(244, 50, 86, 0.10);
      --yellow: #9c6700;
      --yellow-bg: rgba(244, 176, 0, 0.18);
      --purple: #7040ae;
      --purple-bg: rgba(162, 89, 234, 0.14);

      --shadow-sm:
        0 1px 2px rgba(16, 55, 43, 0.05),
        0 1px 3px rgba(16, 55, 43, 0.08);

      --shadow-lg:
        0 24px 60px -24px rgba(16, 95, 72, 0.24);
    }

    body::before {
      background: radial-gradient(
        circle,
        #bfeeda 0%,
        transparent 70%
      ) !important;
    }

    body::after {
      background: radial-gradient(
        circle,
        #b8e7d6 0%,
        transparent 70%
      ) !important;
    }

    .mark,
    .brand .mark {
      box-shadow: 0 6px 20px -6px rgba(22, 135, 108, 0.42) !important;
    }

    .nav-link:hover {
      background: rgba(22, 135, 108, 0.10) !important;
      color: var(--accent-dark) !important;
    }

    .role-badge,
    .badge {
      background: rgba(22, 135, 108, 0.12) !important;
      color: var(--accent-dark) !important;
    }

    .field:focus,
    form:focus-within {
      border-color: rgba(22, 135, 108, 0.55) !important;
      box-shadow: 0 0 0 4px rgba(22, 135, 108, 0.14) !important;
    }

    .bubble.user {
      box-shadow: 0 8px 20px -10px rgba(22, 135, 108, 0.42) !important;
    }

    .avatar.user {
      background: linear-gradient(
        135deg,
        #16876c,
        #63cfa4
      ) !important;
    }

    #send,
    button[type="submit"] {
      box-shadow: 0 6px 16px -6px rgba(22, 135, 108, 0.48) !important;
    }

    .status.available,
    .status.active,
    .status.returned {
      background: rgba(99, 207, 164, 0.20) !important;
      color: #0f6954 !important;
    }

    .status.cancelled {
      background: rgba(119, 119, 119, 0.14);
      color: #5d5d5d;
    }

    .cancel-request {
      margin-top: 0.85rem;
      padding: 0.5rem 0.72rem;
      border: 1px solid rgba(244, 50, 86, 0.24);
      border-radius: 10px;
      background: rgba(244, 50, 86, 0.07);
      color: #c92e4b;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-request:hover {
      background: rgba(244, 50, 86, 0.14);
    }

    .cancel-request:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (min-width: 561px) {
      .main-nav {
        flex-wrap: nowrap !important;
      }

      .main-nav .nav-link {
        padding: 0.38rem 0.55rem !important;
        font-size: 0.74rem !important;
        white-space: nowrap !important;
      }
    }

  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand-area">
        <div class="brand">
          <div class="mark">S</div>

          <div>
            <h1>Supply Sage</h1>
            <span class="tag">Lab equipment, checked out and tracked.</span>
          </div>
        </div>

        <nav class="main-nav" aria-label="Primary navigation">
            <a class="nav-link" href="/">Chat</a>
            <a class="nav-link" href="/inventory">Inventory</a>
            <a
              id="nav-manager-dashboard"
              class="nav-link"
              href="/manager"
            >
              Dashboard
            </a>
            <a
              class="nav-link active"
              href="/manager/requests"
              title="Request Queue"
              >
              Request
            </a>
            <a
              id="nav-damage-queue"
              class="nav-link"
              href="/manager/damage-reports"
              title="Damage Queue"
              >
              Damage
            </a>
          </nav>
      </div>

      <div class="account">
        <span id="signed-in-as">Checking sign-in…</span>
        <button id="logout" type="button">Log out</button>
      </div>
    </header>

    <main class="page-card">
      <section class="page-heading">
        <div>
          <h2>Request queue</h2>
          <p>
            Review pending equipment requests and approve or reject them directly.
          </p>
        </div>

        <span id="role-badge" class="role-badge">Loading role…</span>
      </section>

      <section class="summary-card">
        <span>Requests awaiting review</span>
        <strong id="pending-count">–</strong>
      </section>

      <section id="request-list" class="request-list" aria-live="polite">
        <div class="empty">Loading pending requests…</div>
      </section>
    </main>
  </div>

  <script>
    const signedInAs = document.getElementById("signed-in-as");
    const roleBadge = document.getElementById("role-badge");
    const logoutBtn = document.getElementById("logout");
    const pendingCount = document.getElementById("pending-count");
    const requestList = document.getElementById("request-list");

    let currentUser = null;
    let requests = [];

    function formatDate(value) {
      if (!value) {
        return "Not set";
      }

      const parsed = new Date(`${value}T12:00:00`);

      if (Number.isNaN(parsed.getTime())) {
        return value;
      }

      return new Intl.DateTimeFormat(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric",
        },
      ).format(parsed);
    }

    async function readError(response) {
      const text = await response.text();

      try {
        const parsed = JSON.parse(text);
        return parsed.detail || parsed.message || text;
      } catch {
        return text || `Request failed with status ${response.status}.`;
      }
    }

    async function loadSession() {
      const response = await fetch("/api/me", {
        credentials: "same-origin",
      });

      if (response.status === 401) {
        window.location.assign("/api/auth/login");
        return false;
      }

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      currentUser = await response.json();

      if (currentUser.role !== "lab_manager") {
        window.location.assign("/");
        return false;
      }

      signedInAs.textContent = `${currentUser.name} (Lab Manager)`;
      roleBadge.textContent = "Lab Manager";

      return true;
    }

    function createPill(text) {
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = text;
      return pill;
    }

    function renderRequests() {
      requestList.innerHTML = "";
      pendingCount.textContent = requests.length;

      if (requests.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";

        const title = document.createElement("strong");
        title.textContent = "The queue is clear.";

        const body = document.createElement("span");
        body.textContent = "There are no checkout requests waiting for approval.";

        empty.append(title, body);
        requestList.appendChild(empty);
        return;
      }

      for (const request of requests) {
        const card = document.createElement("article");
        card.className = "request-card";
        card.dataset.checkoutId = request.checkout_id;

        const main = document.createElement("div");

        const titleRow = document.createElement("div");
        titleRow.className = "request-title";

        const titleArea = document.createElement("div");

        const title = document.createElement("h3");
        title.textContent = request.item_name;

        const requestId = document.createElement("p");
        requestId.className = "request-id";
        requestId.textContent = request.checkout_id;

        titleArea.append(title, requestId);

        const pendingBadge = document.createElement("span");
        pendingBadge.className = "pending-badge";
        pendingBadge.textContent = "Pending";

        titleRow.append(titleArea, pendingBadge);

        const meta = document.createElement("div");
        meta.className = "request-meta";

        meta.append(
          createPill(`Student: ${request.student_name || "Unknown user"}`),
        );

        if (request.category) {
          meta.append(createPill(request.category.replaceAll("_", " ")));
        }

        if (request.requested_days) {
          meta.append(
            createPill(
              `Requested: ${request.requested_days} day${
                request.requested_days === 1 ? "" : "s"
              }`,
            ),
          );
        }

        if (request.checkout_date) {
          meta.append(
            createPill(`Requested on: ${formatDate(request.checkout_date)}`),
          );
        }

        main.append(titleRow, meta);

        const actionArea = document.createElement("div");
        actionArea.className = "actions";

        const approveButton = document.createElement("button");
        approveButton.className = "action-button approve";
        approveButton.type = "button";
        approveButton.textContent = "Approve";

        approveButton.addEventListener("click", () => {
          decideRequest(request, "approve", card);
        });

        const rejectButton = document.createElement("button");
        rejectButton.className = "action-button reject";
        rejectButton.type = "button";
        rejectButton.textContent = "Reject";

        rejectButton.addEventListener("click", () => {
          decideRequest(request, "deny", card);
        });

        actionArea.append(approveButton, rejectButton);
        card.append(main, actionArea);

        requestList.appendChild(card);
      }
    }

    async function loadRequests() {
      const response = await fetch("/api/manager/requests", {
        credentials: "same-origin",
      });

      if (response.status === 401) {
        window.location.assign("/api/auth/login");
        return;
      }

      if (response.status === 403) {
        window.location.assign("/");
        return;
      }

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const payload = await response.json();
      requests = Array.isArray(payload.requests) ? payload.requests : [];
      renderRequests();
    }

    function showCardNotice(card, type, message) {
      const previous = card.querySelector(".notice");

      if (previous) {
        previous.remove();
      }

      const notice = document.createElement("div");
      notice.className = `notice ${type}`;
      notice.textContent = message;

      card.querySelector("div").appendChild(notice);
    }

    async function decideRequest(request, decision, card) {
      const noteLabel = decision === "approve"
        ? "Optional approval note"
        : "Optional rejection reason";

      const note = window.prompt(noteLabel, "") ?? "";

      const buttons = card.querySelectorAll("button");
      buttons.forEach(button => {
        button.disabled = true;
      });

      try {
        const response = await fetch(
          `/api/manager/requests/${encodeURIComponent(
            request.checkout_id,
          )}/${decision}`,
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ note }),
          },
        );

        if (!response.ok) {
          throw new Error(await readError(response));
        }

        const result = await response.json();

        if (!result.ok) {
          showCardNotice(
            card,
            "error",
            result.reason || "The request could not be updated.",
          );

          buttons.forEach(button => {
            button.disabled = false;
          });

          return;
        }

        const successMessage = decision === "approve"
          ? `${request.item_name} was approved for ${
              request.student_name || "the student"
            }.`
          : `${request.item_name} was rejected.`;

        showCardNotice(card, "success", successMessage);

        // Reload shortly after the visible success state appears. The request
        // no longer belongs in the pending queue after either action.
        window.setTimeout(loadRequests, 650);
      } catch (error) {
        showCardNotice(
          card,
          "error",
          error instanceof Error
            ? error.message
            : "The request could not be updated.",
        );

        buttons.forEach(button => {
          button.disabled = false;
        });
      }
    }

    function showError(message) {
      requestList.innerHTML = "";

      const error = document.createElement("div");
      error.className = "error";
      error.textContent = message;

      requestList.appendChild(error);
    }

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;

      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          credentials: "same-origin",
        });
      } finally {
        window.location.assign("/");
      }
    });

    async function initialize() {
      try {
        const authenticated = await loadSession();

        if (!authenticated) {
          return;
        }

        await loadRequests();
      } catch (error) {
        signedInAs.textContent = "Session unavailable";
        roleBadge.textContent = "Unavailable";

        showError(
          `Could not load the request queue: ${
            error instanceof Error ? error.message : String(error)
          }`,
        );
      }
    }

    initialize();
  </script>
</body>
</html>
