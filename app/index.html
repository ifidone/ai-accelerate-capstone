<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LabBot</title>

  <style>
    :root {
      --bg: #fbf7f3;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #ffffff;
      --border: rgba(20, 20, 40, 0.08);
      --text: #1a1524;
      --text-muted: #6b6880;
      --accent: #7c5cff;
      --accent-grad: linear-gradient(135deg, #7c5cff 0%, #ff6ea8 100%);
      --shadow-sm:
        0 1px 2px rgba(20, 20, 40, 0.04),
        0 1px 3px rgba(20, 20, 40, 0.06);
      --shadow-lg: 0 24px 60px -24px rgba(80, 60, 180, 0.28);
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        system-ui,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
    }

    body::before {
      top: -140px;
      left: -120px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #ffb4c8 0%, transparent 70%);
      animation: float1 14s ease-in-out infinite;
    }

    body::after {
      right: -140px;
      bottom: -180px;
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #b6a5ff 0%, transparent 70%);
      animation: float2 18s ease-in-out infinite;
    }

    @keyframes float1 {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(60px, 80px);
      }
    }

    @keyframes float2 {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-70px, -60px);
      }
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 760px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .main-nav {
      display: flex;
      gap: 0.3rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: var(--shadow-sm);
    }

    .nav-link {
      padding: 0.38rem 0.7rem;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 650;
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
    }

    .nav-link:hover {
      background: rgba(124, 92, 255, 0.1);
      color: var(--accent);
    }

    .nav-link.active {
      background: white;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .brand .mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-grad);
      color: white;
      font-weight: 800;
      letter-spacing: -0.02em;
      box-shadow: 0 6px 20px -6px rgba(124, 92, 255, 0.55);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand .tag {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .persona {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      max-width: 440px;
      padding: 0.35rem 0.4rem 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #signed-in-as {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    button.account-button {
      width: auto;
      height: auto;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 650;
      box-shadow: var(--shadow-sm);
    }

    button.account-button.secondary {
      border: 1px solid rgba(244, 50, 86, 0.22);
      background: rgba(255, 255, 255, 0.92);
      color: #c92e4b;
      box-shadow: none;
    }

    button.account-button.secondary:hover {
      background: rgba(244, 50, 86, 0.08);
      box-shadow: none;
    }

    button.account-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #log {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      height: 60vh;
      min-height: 420px;
      padding: 1.25rem;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #log::-webkit-scrollbar {
      width: 8px;
    }

    #log::-webkit-scrollbar-thumb {
      border-radius: 8px;
      background: rgba(20, 20, 40, 0.12);
    }

    .empty {
      max-width: 340px;
      margin: auto;
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      animation: pop 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .row.user {
      justify-content: flex-end;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .avatar.bot {
      background: var(--accent-grad);
    }

    .bubble {
      max-width: 78%;
      padding: 0.7rem 0.95rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }

    .bubble.bot {
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-sm);
    }

    .bubble.user {
      border-bottom-right-radius: 6px;
      background: var(--accent-grad);
      color: white;
      box-shadow: 0 8px 20px -10px rgba(124, 92, 255, 0.6);
    }

    details {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    details summary {
      cursor: pointer;
      user-select: none;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    details pre {
      margin: 0.4rem 0 0;
      padding: 0.5rem 0.65rem;
      overflow-x: auto;
      border-radius: 10px;
      background: rgba(20, 20, 40, 0.04);
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 0.35rem 0.2rem;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    .composer {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.6);
    }

    form {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.3rem 0.3rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      transition: border-color 140ms, box-shadow 140ms;
    }

    form:focus-within {
      border-color: rgba(124, 92, 255, 0.5);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.12);
    }

    #input {
      flex: 1;
      padding: 0.55rem 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: var(--accent-grad);
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 16px -6px rgba(124, 92, 255, 0.55);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.03);
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    button svg {
      width: 16px;
      height: 16px;
    }

    .hint {
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        padding: 1rem 0.75rem;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }

      .persona {
        max-width: 100%;
      }

      #signed-in-as {
        max-width: 145px;
      }

      #log {
        height: 62vh;
      }

      .bubble {
        max-width: 85%;
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand-area">
        <div class="brand">
          <div class="mark">L</div>
      
          <div>
            <h1>LabBot</h1>
            <span class="tag">Lab equipment, checked out and tracked.</span>
          </div>
        </div>
      
        <nav class="main-nav" aria-label="Primary navigation">
          <a class="nav-link active" href="/">Chat</a>
          <a class="nav-link" href="/inventory">Inventory</a>
        </nav>
      </div>

      <div class="persona">
        <span id="signed-in-as">Checking sign-in…</span>

        <div class="account-actions">
          <button
            id="clear-history"
            class="account-button secondary"
            type="button"
            title="Delete saved chat history"
          >
            Clear history
          </button>

          <button
            id="logout"
            class="account-button"
            type="button"
            title="Log out of LabBot"
          >
            Log out
          </button>
        </div>
      </div>
    </header>

    <div class="card">
      <div id="log" role="log" aria-live="polite">
        <div class="empty">
          <strong>Loading your history…</strong>
          Your saved LabBot messages will appear here.
        </div>
      </div>

      <div class="composer">
        <form id="form">
          <input
            id="input"
            placeholder="Ask LabBot about equipment…"
            autocomplete="off"
            disabled
          />

          <button id="send" type="submit" aria-label="Send" disabled>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
              <path d="M13 6l6 6-6 6"></path>
            </svg>
          </button>
        </form>
      </div>
    </div>

    <div class="hint">Press Enter to send</div>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const form = document.getElementById("form");
    const sendBtn = document.getElementById("send");
    const signedInAs = document.getElementById("signed-in-as");
    const logoutBtn = document.getElementById("logout");
    const clearHistoryBtn = document.getElementById("clear-history");

    let currentUser = null;

    function initials(name) {
      return String(name || "User")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }

    function userAvatarStyle() {
      const seed = currentUser?.id || currentUser?.email || "user";

      const hue = (
        Array.from(seed).reduce(
          (total, character) => total + character.charCodeAt(0),
          0,
        ) * 37
      ) % 360;

      return `
        background: linear-gradient(
          135deg,
          hsl(${hue} 75% 62%),
          hsl(${(hue + 40) % 360} 70% 55%)
        );
      `;
    }

    function clearEmpty() {
      const empty = log.querySelector(".empty");

      if (empty) {
        empty.remove();
      }
    }

    function showEmptyHistory(
      message = "Start a new LabBot conversation whenever you are ready.",
    ) {
      log.innerHTML = "";

      const empty = document.createElement("div");
      empty.className = "empty";

      const title = document.createElement("strong");
      title.textContent = "No saved messages.";

      const body = document.createElement("span");
      body.textContent = message;

      empty.append(title, body);
      log.appendChild(empty);
    }

    function add(role, text, extra = null) {
      clearEmpty();

      const row = document.createElement("div");
      row.className = `row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role}`;

      if (role === "bot") {
        avatar.textContent = "L";
      } else {
        avatar.textContent = initials(currentUser?.name);
        avatar.style.cssText = userAvatarStyle();
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;

      /*
        textContent intentionally prevents rendering HTML from saved history
        or model responses.
      */
      bubble.textContent = text;

      if (extra) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        const pre = document.createElement("pre");

        summary.textContent = "Details";
        pre.textContent = extra;

        details.append(summary, pre);
        bubble.appendChild(details);
      }

      if (role === "user") {
        row.append(bubble, avatar);
      } else {
        row.append(avatar, bubble);
      }

      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function showTyping() {
      clearEmpty();

      const row = document.createElement("div");
      row.className = "row bot";

      const avatar = document.createElement("div");
      avatar.className = "avatar bot";
      avatar.textContent = "L";

      const bubble = document.createElement("div");
      bubble.className = "bubble bot";

      const typing = document.createElement("div");
      typing.className = "typing";

      for (let index = 0; index < 3; index += 1) {
        typing.appendChild(document.createElement("span"));
      }

      bubble.appendChild(typing);
      row.append(avatar, bubble);

      log.appendChild(row);
      log.scrollTop = log.scrollHeight;

      return row;
    }

    function setChatEnabled(enabled) {
      input.disabled = !enabled;
      sendBtn.disabled = !enabled;
    }

    async function readError(response) {
      const text = await response.text();

      try {
        const parsed = JSON.parse(text);
        return parsed.detail || parsed.message || text;
      } catch {
        return text || `Request failed with status ${response.status}.`;
      }
    }

    async function loadSession() {
      const response = await fetch("/api/me", {
        credentials: "same-origin",
      });

      if (response.status === 401) {
        window.location.assign("/api/auth/login");
        return false;
      }

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      currentUser = await response.json();

      const displayName = currentUser.name || currentUser.email;
      const role = currentUser.role === "lab_manager"
        ? "Lab Manager"
        : "Student";

      signedInAs.textContent = `${displayName} (${role})`;

      return true;
    }

    async function loadHistory() {
      const response = await fetch("/api/history", {
        credentials: "same-origin",
      });

      if (response.status === 401) {
        window.location.assign("/api/auth/login");
        return;
      }

      if (!response.ok) {
        throw new Error(await readError(response));
      }

      const history = await response.json();

      if (!Array.isArray(history) || history.length === 0) {
        showEmptyHistory(
          "Ask about equipment availability, checkout requests, returns, or due dates.",
        );
        return;
      }

      log.innerHTML = "";

      for (const message of history) {
        const role = message.role === "assistant" ? "bot" : "user";
        add(role, message.content || "");
      }

      log.scrollTop = log.scrollHeight;
    }

    async function send(message) {
      add("user", message);
      setChatEnabled(false);

      const typingRow = showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message }),
        });

        if (response.status === 401) {
          window.location.assign("/api/auth/login");
          return;
        }

        if (!response.ok) {
          throw new Error(await readError(response));
        }

        const data = await response.json();
        typingRow.remove();

        const debug = data.intent
          ? `intent: ${data.intent}\n\n${JSON.stringify(data.result, null, 2)}`
          : null;

        add("bot", data.reply || "I could not generate a reply.", debug);
      } catch (error) {
        typingRow.remove();

        add(
          "bot",
          `Error: ${
            error instanceof Error ? error.message : String(error)
          }`,
        );
      } finally {
        setChatEnabled(true);
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || input.disabled) {
        return;
      }

      input.value = "";
      send(message);
    });

    clearHistoryBtn.addEventListener("click", async () => {
      const confirmed = window.confirm(
        "Delete your saved LabBot conversation history? This cannot be undone.",
      );

      if (!confirmed) {
        return;
      }

      clearHistoryBtn.disabled = true;

      try {
        const response = await fetch("/api/history", {
          method: "DELETE",
          credentials: "same-origin",
        });

        if (response.status === 401) {
          window.location.assign("/api/auth/login");
          return;
        }

        if (!response.ok) {
          throw new Error(await readError(response));
        }

        showEmptyHistory(
          "Your saved conversation was deleted. Start a new conversation whenever you are ready.",
        );
      } catch (error) {
        add(
          "bot",
          `I could not clear your history: ${
            error instanceof Error ? error.message : String(error)
          }`,
        );
      } finally {
        clearHistoryBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;

      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          credentials: "same-origin",
        });
      } finally {
        window.location.assign("/");
      }
    });

    async function initialize() {
      setChatEnabled(false);

      try {
        const authenticated = await loadSession();

        if (!authenticated) {
          return;
        }

        await loadHistory();

        setChatEnabled(true);
        input.focus();
      } catch (error) {
        signedInAs.textContent = "Sign-in unavailable";

        add(
          "bot",
          `Could not initialize LabBot: ${
            error instanceof Error ? error.message : String(error)
          }`,
        );
      }
    }

    initialize();
  </script>
</body>
</html>
